version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /examples/react-example
      - /examples/vue-example
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
